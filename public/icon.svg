<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Outer Glow Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Droplet Gradient -->
    <linearGradient id="dropGrad" x1="256" y1="70" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Flowing S-Ribbon Gradient -->
    <linearGradient id="sRibbonGrad" x1="160" y1="180" x2="350" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Soft Drop Shadow Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Pure Water Droplet with Glow -->
  <g filter="url(#glow)">
    <path d="M256 72 C256 72 136 236 136 332 C136 398.27 189.73 452 256 452 C322.27 452 376 398.27 376 332 C376 236 256 72 256 72 Z" fill="url(#dropGrad)"/>
  </g>

  <!-- Flowing 'S' Wave inside Droplet -->
  <path d="M256 120 C256 120 188 238 188 308 C188 350 220 384 256 384 C292 384 316 350 306 308 C294 262 230 250 240 196 C246 160 256 120 256 120 Z" fill="url(#sRibbonGrad)"/>

  <!-- Crisp Light Highlight Arc -->
  <path d="M256 112 C256 112 180 230 180 320 C180 342 188 362 202 378 C188 356 186 318 208 266 C228 214 256 112 256 112 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Sparkle Reflection Specular Dots -->
  <circle cx="308" cy="256" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="328" cy="286" r="6" fill="#ffffff" opacity="0.75"/>
</svg>
